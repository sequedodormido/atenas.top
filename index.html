
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atenas | Siempre es ahora</title>
  <meta name="description" content="Atenas. Siempre es ahora. Música, discos e historias.">
  <meta name="author" content="Atenas">
  <meta name="theme-color" content="#11100f">

  <link rel="canonical" href="https://atenas.top/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --background: #11100f;
      --cream: #eeeae3;
      --secondary: #bdb6ad;
      --copper: #bd765c;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--cream);
      font-family: 'DM Sans', Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* LOGOTIPO */

    .logo-header {
      display: block;
      width: 90px;
      height: auto;
    }

    /* CABECERA */

    header {
      width: 100%;
      min-height: 88px;
      padding: 22px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #11100f;
      border-bottom: 1px solid rgba(238,234,227,.12);
      position: relative;
      z-index: 5;
    }

    .language {
      background: transparent;
      color: var(--cream);
      border: 1px solid rgba(238,234,227,.32);
      padding: 9px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .3s ease;
    }

    .language:hover {
      border-color: var(--copper);
      color: var(--copper);
    }

    /* PORTADA FOTOGRÁFICA */

    main {
      flex: 1;
      min-height: min(780px, calc(100svh - 150px));
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 100px 7%;
      position: relative;
      overflow: hidden;
      text-align: center;

      background-image:
        linear-gradient(
          90deg,
          rgba(12,12,15,.68) 0%,
          rgba(12,12,15,.43) 50%,
          rgba(12,12,15,.35) 100%
        ),
        linear-gradient(
          0deg,
          rgba(12,12,15,.48) 0%,
          transparent 55%
        ),
        url("./atenas-hero.jpg");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* FRASE CENTRAL: BODONI MODA */

    h1 {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-size: clamp(36px, 5.5vw, 62px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: 2px;
      color: var(--cream);
      text-transform: uppercase;
      text-shadow: 0 2px 24px rgba(0,0,0,.4);
      font-optical-sizing: auto;
    }

    /* ENLACE */

    .button {
      display: inline-block;
      margin-top: 42px;
      padding: 15px 22px;
      border: 1px solid rgba(189,118,92,.75);
      color: var(--cream);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      transition: all .3s ease;
    }

    .button:hover {
      background: var(--copper);
      border-color: var(--copper);
      color: #11100f;
    }

    /* PIE CENTRADO */

    footer {
      min-height: 75px;
      padding: 18px 8%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: #11100f;
      border-top: 1px solid rgba(238,234,227,.12);
      color: #77716a;
      font-size: 10px;
      letter-spacing: 1px;
    }

    /* IDIOMAS */

    .english {
      display: none;
    }

    body.lang-en .spanish {
      display: none;
    }

    body.lang-en .english {
      display: initial;
    }

    /* MÓVIL */

    @media (max-width: 650px) {
      header {
        min-height: 76px;
        padding: 19px 7%;
      }

      .logo-header {
        width: 82px;
      }

      main {
        min-height: calc(100svh - 141px);
        padding: 70px 7%;
        background-position: center center;
      }

      h1 {
        font-size: clamp(32px, 8vw, 45px);
        letter-spacing: 1px;
      }

      .button {
        margin-top: 32px;
      }

      footer {
        min-height: 65px;
        padding: 18px 7%;
      }
    }
  </style>
</head>

<body>

  <header>
    <img class="logo-header" src="./atenas-logo.png" alt="Atenas">

    <button class="language" onclick="toggleLanguage()">ENGLISH</button>
  </header>

  <main>
    <div class="content">

      <h1 class="spanish">SIEMPRE ES AHORA</h1>
      <h1 class="english">IT'S ALWAYS NOW</h1>

      <a class="button"
         href="https://linktr.ee/davidatenas"
         target="_blank"
         rel="noopener noreferrer">
        <span class="spanish">Música y discos</span>
        <span class="english">Music and records</span>
      </a>

    </div>
  </main>

  <footer>
    <span>© 2026 Atenas. Todos los derechos reservados.</span>
  </footer>

  <script>
    function toggleLanguage() {
      const english = document.body.classList.toggle("lang-en");

      document.documentElement.lang = english ? "en" : "es";

      document.querySelector(".language").textContent =
        english ? "ESPAÑOL" : "ENGLISH";
    }
  </script>

</body>
</html>
