
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atenas | Siempre es ahora</title>
  <meta name="description" content="Atenas. Siempre es ahora. Música, discos e historias.">
  <meta name="author" content="Atenas">
  <meta name="theme-color" content="#11100f">

  <link rel="canonical" href="https://atenas.top/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --background: #11100f;
      --cream: #eeeae3;
      --secondary: #bdb6ad;
      --copper: #bd765c;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--cream);
      font-family: 'DM Sans', Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* CABECERA Y LOGOTIPO */

    header {
      width: 100%;
      min-height: 105px;
      padding: 20px 7%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 35px;
      background: #11100f;
      border-bottom: 1px solid rgba(238,234,227,.12);
      position: relative;
      z-index: 5;
    }

    .logo-header {
      display: block;
      width: 125px;
      height: auto;
    }

    /* MENÚ MINIMALISTA */

    .menu {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(18px, 3vw, 42px);
    }

    .menu-item {
      color: #bdb6ad;
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
      transition: color .3s ease;
    }

    .menu-item:hover {
      color: var(--copper);
    }

    .language {
      background: transparent;
      color: var(--cream);
      border: 1px solid rgba(238,234,227,.32);
      padding: 9px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .3s ease;
    }

    .language:hover {
      border-color: var(--copper);
      color: var(--copper);
    }

    /* PORTADA FOTOGRÁFICA */

    main {
      flex: 1;
      min-height: min(780px, calc(100svh - 167px));
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 100px 7%;
      position: relative;
      overflow: hidden;
      text-align: center;

      background-image:
        linear-gradient(
          90deg,
          rgba(12,12,15,.68) 0%,
          rgba(12,12,15,.43) 50%,
          rgba(12,12,15,.35) 100%
        ),
        linear-gradient(
          0deg,
          rgba(12,12,15,.48) 0%,
          transparent 55%
        ),
        url("./atenas-hero.jpg");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* FRASE CENTRAL */

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(36px, 5.5vw, 62px);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 2px;
      color: var(--cream);
      text-transform: uppercase;
      text-shadow: 0 2px 24px rgba(0,0,0,.35);
    }

    /* PIE CENTRADO */

    footer {
      min-height: 62px;
      padding: 18px 8%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: #11100f;
      border-top: 1px solid rgba(238,234,227,.12);
      color: #77716a;
      font-size: 10px;
      letter-spacing: 1px;
    }

    /* IDIOMAS */

    .english {
      display: none;
    }

    body.lang-en .spanish {
      display: none;
    }

    body.lang-en .english {
      display: initial;
    }

    /* MÓVIL */

    @media (max-width: 800px) {
      header {
        grid-template-columns: 1fr auto;
        gap: 18px;
        padding: 19px 7% 16px;
      }

      .logo-header {
        width: 110px;
      }

      .menu {
        grid-column: 1 / -1;
        grid-row: 2;
        justify-content: center;
        flex-wrap: wrap;
        gap: 16px 23px;
      }

      .menu-item {
        font-size: 9px;
        letter-spacing: 1.5px;
      }

      .language {
        grid-column: 2;
        grid-row: 1;
      }

      main {
        min-height: calc(100svh - 175px);
        padding: 70px 7%;
        background-position: center center;
      }

      h1 {
        font-size: clamp(32px, 8vw, 45px);
        letter-spacing: 1px;
      }

      footer {
        min-height: 55px;
        padding: 16px 7%;
      }
    }

    @media (max-width: 380px) {
      .menu {
        gap: 13px 17px;
      }

      .menu-item {
        font-size: 8px;
        letter-spacing: 1px;
      }
    }
  </style>
</head>

<body>

  <header>
    <img class="logo-header" src="./atenas-logo.png" alt="Atenas">

    <nav class="menu" aria-label="Menú principal">
      <span class="menu-item spanish">Música</span>
      <span class="menu-item english">Music</span>

      <span class="menu-item spanish">Discos</span>
      <span class="menu-item english">Records</span>

      <span class="menu-item spanish">Sobre Atenas</span>
      <span class="menu-item english">About</span>

      <span class="menu-item spanish">Contacto</span>
      <span class="menu-item english">Contact</span>
    </nav>

    <button class="language" onclick="toggleLanguage()">ENGLISH</button>
  </header>

  <main>
    <div class="content">
      <h1 class="spanish">SIEMPRE ES AHORA</h1>
      <h1 class="english">IT'S ALWAYS NOW</h1>
    </div>
  </main>

  <footer>
    <span class="spanish">© 2026 Atenas. Todos los derechos reservados.</span>
    <span class="english">© 2026 Atenas. All rights reserved.</span>
  </footer>

  <script>
    function toggleLanguage() {
      const english = document.body.classList.toggle("lang-en");

      document.documentElement.lang = english ? "en" : "es";

      document.querySelector(".language").textContent =
        english ? "ESPAÑOL" : "ENGLISH";
    }
  </script>

</body>
</html>
