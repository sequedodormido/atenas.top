
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atenas | Siempre es ahora</title>
  <meta name="description" content="Atenas. Siempre es ahora. Música, discos e historias.">
  <meta name="author" content="Atenas">
  <meta name="theme-color" content="#11100f">

  <link rel="canonical" href="https://atenas.top/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --background: #11100f;
      --cream: #eeeae3;
      --secondary: #bdb6ad;
      --copper: #bd765c;
      --electric: #6489cf;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--cream);
      font-family: 'DM Sans', Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* LOGOTIPO ORIGINAL DE ATENAS */

    .logo-header {
      display: block;
      width: 90px;
      height: auto;
    }

    .logo-main {
      display: block;
      width: min(100%, 380px);
      height: auto;
      margin-bottom: 38px;
    }

    .logo-footer {
      display: block;
      width: 65px;
      height: auto;
    }

    /* CABECERA */

    header {
      width: 100%;
      min-height: 88px;
      padding: 22px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #11100f;
      border-bottom: 1px solid rgba(238,234,227,.12);
      position: relative;
      z-index: 5;
    }

    .language {
      background: transparent;
      color: var(--cream);
      border: 1px solid rgba(238,234,227,.32);
      padding: 9px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .3s ease;
    }

    .language:hover {
      border-color: var(--electric);
      color: var(--electric);
    }

    /* FONDO FOTOGRÁFICO */

    main {
      flex: 1;
      min-height: min(780px, calc(100svh - 150px));
      display: flex;
      align-items: center;
      padding: 100px 10%;
      position: relative;
      overflow: hidden;

      background-image:
        linear-gradient(
          90deg,
          rgba(12,12,15,.76) 0%,
          rgba(12,12,15,.48) 48%,
          rgba(12,12,15,.20) 100%
        ),
        linear-gradient(
          0deg,
          rgba(12,12,15,.42) 0%,
          transparent 55%
        ),
        url("./atenas-hero.jpg");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 850px;
    }

    .blue-line {
      width: 34px;
      height: 2px;
      background: var(--electric);
      margin-bottom: 28px;
      box-shadow: 0 0 12px rgba(100,137,207,.35);
    }

    /* FRASE PRINCIPAL */

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(44px, 7vw, 78px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: 3px;
      color: var(--cream);
      text-transform: uppercase;
      text-shadow: 0 2px 24px rgba(0,0,0,.35);
    }

    .button {
      display: inline-block;
      margin-top: 48px;
      padding: 15px 22px;
      border: 1px solid rgba(100,137,207,.75);
      color: var(--cream);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      transition: all .3s ease;
    }

    .button:hover {
      background: var(--electric);
      border-color: var(--electric);
      color: #11100f;
    }

    /* PIE DE PÁGINA */

    footer {
      min-height: 75px;
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #11100f;
      border-top: 1px solid rgba(238,234,227,.12);
      color: #77716a;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .footer-mark {
      color: var(--electric);
      font-size: 10px;
      letter-spacing: 2px;
    }

    /* IDIOMAS */

    .english {
      display: none;
    }

    body.lang-en .spanish {
      display: none;
    }

    body.lang-en .english {
      display: initial;
    }

    /* MÓVIL */

    @media (max-width: 650px) {
      header {
        min-height: 76px;
        padding: 19px 7%;
      }

      .logo-header {
        width: 82px;
      }

      main {
        min-height: calc(100svh - 141px);
        padding: 85px 7%;
        align-items: flex-end;
        background-position: center center;

        background-image:
          linear-gradient(
            0deg,
            rgba(12,12,15,.82) 0%,
            rgba(12,12,15,.48) 55%,
            rgba(12,12,15,.18) 100%
          ),
          url("./atenas-hero.jpg");
      }

      .logo-main {
        width: min(100%, 320px);
        margin-bottom: 30px;
      }

      .blue-line {
        margin-bottom: 22px;
      }

      h1 {
        font-size: clamp(39px, 10vw, 58px);
        letter-spacing: 1px;
      }

      .button {
        margin-top: 35px;
      }

      footer {
        padding: 18px 7%;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .logo-footer {
        width: 60px;
      }
    }
  </style>
</head>

<body>

  <header>
    <img class="logo-header" src="./atenas-logo.png" alt="Atenas">
    <button class="language" onclick="toggleLanguage()">ENGLISH</button>
  </header>

  <main>
    <div class="content">

      <img class="logo-main" src="./atenas-logo.png" alt="Atenas">

      <div class="blue-line"></div>

      <h1 class="spanish">Siempre es ahora.</h1>
      <h1 class="english">It's always now.</h1>

      <a class="button"
         href="https://linktr.ee/davidatenas"
         target="_blank"
         rel="noopener noreferrer">
        <span class="spanish">Música y discos</span>
        <span class="english">Music and records</span>
      </a>

    </div>
  </main>

  <footer>
    <img class="logo-footer" src="./atenas-logo.png" alt="Atenas">
    <span>© 2026 Atenas. Todos los derechos reservados.</span>
  </footer>

  <script>
    function toggleLanguage() {
      const english = document.body.classList.toggle("lang-en");

      document.documentElement.lang = english ? "en" : "es";

      document.querySelector(".language").textContent =
        english ? "ESPAÑOL" : "ENGLISH";
    }
  </script>

</body>
</html>
